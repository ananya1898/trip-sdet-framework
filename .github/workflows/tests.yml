name: TripMate Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test framework
        uses: actions/checkout@v4
        with:
          path: trip-sdet-framework

      - name: Checkout TripMate application
        uses: actions/checkout@v4
        with:
          repository: https://github.com/ananya1898/tripmate.git
          path: tripmate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install framework dependencies
        working-directory: trip-sdet-framework
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install TripMate dependencies
        working-directory: tripmate
        run: |
          pip install -r requirements.txt

      - name: Start TripMate API
        working-directory: tripmate
        run: |
          nohup uvicorn backend.main:app --host 0.0.0.0 --port 8000 > tripmate.log 2>&1 &
          sleep 5

      - name: Run tests
        working-directory: trip-sdet-framework
        run: |
          mkdir -p reports
          pytest -v --html=reports/report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripmate-test-report
          path: trip-sdet-framework/reports/report.html